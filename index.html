<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メカニック価格計算表</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      text-align: center;
      margin: 0;
    }

    h1 {
      background: #111;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 15px;
      gap: 10px;
    }

    .item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .box {
      background: white;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .price {
      color: #666;
      margin: 8px 0;
    }

    .qty {
      font-size: 20px;
      margin: 10px;
      display: inline-block;
      width: 40px;
    }

    button {
      font-size: 15px;
      padding: 8px 12px;
      margin: 4px;
</html>
