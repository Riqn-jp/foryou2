<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メカニック価格計算表</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      text-align: center;
      margin: 0;
    }

    h1 {
      background: #111;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 15px;
      gap: 10px;
    }

    .item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .box {
      background: white;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      font-size: 15px;
      padding: 8px 12px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .checkout {
      background: #111;
      font-size: 20px;
      width: 90%;
      max-width: 700px;
      margin: 15px auto;
      display: block;
      padding: 14px;
    }

    .result {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>メカニック価格計算表</h1>

  <div class="box">
    <label>カラー選択</label>
    <select id="colorType" onchange="calculateTotal()">
      <option value="white">白</option>
      <option value="black">黒</option>
    </select>
  </div>

  <div class="container">

    <div class="item"><label>エンジン</label><select id="engine" onchange="calculateTotal()"><option value="0">なし</option><option value="4000000">Lv1</option><option value="8000000">Lv2</option><option value="12000000">Lv3</option><option value="14000000">Lv4</option><option value="18000000">Lv5</option></select></div>

    <div class="item"><label>ブレーキ</label><select id="brakes" onchange="calculateTotal()"><option value="0">なし</option><option value="4000000">Lv1</option><option value="6000000">Lv2</option><option value="8000000">Lv3</option></select></div>

    <div class="item"><label>トランスミッション</label><select id="transmission" onchange="calculateTotal()"><option value="0">なし</option><option value="2000000">Lv1</option><option value="4000000">Lv2</option><option value="6000000">Lv3</option><option value="8000000">Lv4</option></select></div>

    <div class="item"><label>サスペンション</label><select id="suspension" onchange="calculateTotal()"><option value="0">なし</option><option value="2000000">Lv1</option><option value="4000000">Lv2</option><option value="6000000">Lv3</option><option value="8000000">Lv4</option></select></div>

    <div class="item"><label>ターボ</label><select id="turbo" onchange="calculateTotal()"><option value="0">なし</option><option value="4000000">あり</option></select></div>

    <div class="item"><label>ニトロ</label><select id="nitro" onchange="calculateTotal()"><option value="0">なし</option><option value="4000000">あり</option></select></div>

    <div class="item"><label>アーマー</label><select id="armor" onchange="calculateTotal()"><option value="0">なし</option><option value="6000000">あり</option></select></div>

    <div class="item"><label>ハーネス</label><select id="harness" onchange="calculateTotal()"><option value="0">なし</option><option value="3000000">あり</option></select></div>

    <div class="item"><label>外装カスタム（1箇所 ¥300,000）</label><input type="number" id="exterior" min="0" max="30" value="0" onchange="calculateTotal()" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:15px;box-sizing:border-box;"></div>

  </div>

  <button class="checkout" onclick="calculateTotal(false)">通常価格を計算</button>
  <button class="checkout" onclick="calculateTotal(true)">提携先価格（2割引）を計算</button>
  <button class="checkout" onclick="confirmCheckout()">会計確定（リセット）</button>

  <div class="box result" id="result">合計金額：¥0</div>

  <script>
    function getIds() {
      return ['engine','brakes','transmission','suspension','turbo','nitro','armor','harness'];
    }

    function calculateTotal(isPartnerDiscount = false) {
      let total = 0;

      getIds().forEach(id => {
        total += Number(document.getElementById(id).value);
      });

      const exteriorCount = Number(document.getElementById('exterior').value) || 0;
      total += exteriorCount * 300000;

      if (document.getElementById('colorType').value === 'white') {
        total = Math.floor(total / 2);
      }

      if (isPartnerDiscount) {
        total = Math.floor(total * 0.8);
        document.getElementById('result').innerText = `提携先価格（2割引）：¥${total.toLocaleString()}`;
      } else {
        document.getElementById('result').innerText = `合計金額：¥${total.toLocaleString()}`;
      }
    }

    function confirmCheckout() {
      alert("会計を確定しました。入力内容をリセットします。\n\n" + document.getElementById('result').innerText);

      document.getElementById('colorType').value = 'white';

      getIds().forEach(id => {
        document.getElementById(id).value = '0';
      });

      document.getElementById('exterior').value = '0';

      calculateTotal(false);
    }

    calculateTotal(false);
  </script>

</body>
</html>
