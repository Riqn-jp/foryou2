<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メカニック価格計算表</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      text-align: center;
      margin: 0;
    }

    h1 {
      background: #111;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 15px;
      gap: 10px;
    }

    .item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .box {
      background: white;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .price {
      color: #666;
      margin: 8px 0;
    }

    .qty {
      font-size: 20px;
      margin: 10px;
      display: inline-block;
      width: 40px;
    }

    button {
      font-size: 15px;
      padding: 8px 12px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .minus {
      background: #d63031;
    }

    .checkout {
      background: #111;
      font-size: 20px;
      width: 90%;
      max-width: 700px;
      margin: 15px auto;
      display: block;
      padding: 14px;
    }

    .result {
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>メカニック価格計算表</h1>

  <div class="box">
    <label>カラー選択</label>
    <select id="colorType" onchange="calculateTotal()">
      <option value="white">白</option>
      <option value="black">黒</option>
    </select>
  </div>

  <div id="shop" class="container">

    <div class="item">
      <label>エンジン</label>
      <select id="engine" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="10000">Lv1</option>
        <option value="20000">Lv2</option>
        <option value="30000">Lv3</option>
        <option value="40000">Lv4</option>
      </select>
    </div>

    <div class="item">
      <label>ブレーキ</label>
      <select id="brakes" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="8000">Lv1</option>
        <option value="16000">Lv2</option>
        <option value="24000">Lv3</option>
      </select>
    </div>

    <div class="item">
      <label>トランスミッション</label>
      <select id="transmission" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="9000">Lv1</option>
        <option value="18000">Lv2</option>
        <option value="27000">Lv3</option>
      </select>
    </div>

    <div class="item">
      <label>サスペンション</label>
      <select id="suspension" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="7000">Lv1</option>
        <option value="14000">Lv2</option>
        <option value="21000">Lv3</option>
        <option value="28000">Lv4</option>
      </select>
    </div>

    <div class="item">
      <label>ターボ</label>
      <select id="turbo" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="25000">あり</option>
      </select>
    </div>

    <div class="item">
      <label>ニトロ</label>
      <select id="nitro" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="30000">あり</option>
      </select>
    </div>

    <div class="item">
      <label>アーマー</label>
      <select id="armor" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="20000">あり</option>
      </select>
    </div>

    <div class="item">
      <label>ハーネス</label>
      <select id="harness" onchange="calculateTotal()">
        <option value="0">なし</option>
        <option value="15000">あり</option>
      </select>
    </div>

  </div>

  <button class="checkout" onclick="calculateTotal()">合計金額を計算</button>

  <div class="box result" id="result">
    合計金額：¥0
  </div>

  <script>
    function calculateTotal() {
      const ids = [
        'engine',
        'brakes',
        'transmission',
        'suspension',
        'turbo',
        'nitro',
        'armor',
        'harness'
      ];

      let total = 0;

      ids.forEach(id => {
        total += Number(document.getElementById(id).value);
      });

      if (document.getElementById('colorType').value === 'black') {
        total += 5000;
      }

      document.getElementById('result').innerText =
        `合計金額：¥${total.toLocaleString()}`;
    }

    calculateTotal();
  </script>

</body>
</html>
