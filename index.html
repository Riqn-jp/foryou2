<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiveM Crafting & Inventory Guide</title>
  <!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
 
  <style>
    /* ----------------------------------
       カラー＆ベーススタイル
    ---------------------------------- */
    :root {
      --bg-color: #f0f8ff;         /* アリスブルー */
      --card-bg: #ffffff;          /* カード背景 */
      --main-pink: #f8bbd0;        /* 薄ピンク */
      --dark-pink: #ec407a;        /* 濃いピンク */
      --main-blue: #b3e5fc;        /* 薄水色 */
      --dark-blue: #0288d1;        /* 濃い水色 */
      --text-main: #2c3e50;        /* メイン文字 */
      --text-sub: #546e7a;         /* サブ文字 */
      --ok-color: #2e7d32;         /* 成功緑 */
      --short-color: #c62828;      /* 不足赤 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', 'Hiragino Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #d81b60;
      margin-bottom: 6px;
      font-weight: 900;
      text-shadow: 2px 2px 0px #fff;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* 👤 メンバー選択バー */
    .user-select-bar {
      background-color: #ffffff;
      border: 3px dashed var(--main-pink);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .user-select-bar label {
      font-weight: 900;
      color: #d81b60;
      font-size: 1rem;
    }

    .user-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .user-select-bar select {
      border: 2px solid var(--main-pink);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* ボタン共通 */
    .btn {
      background-color: var(--main-pink);
      color: #880e4f;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .btn:hover {
      background-color: var(--dark-pink);
      color: #fff;
    }

    .btn-blue {
      background-color: var(--main-blue);
      color: var(--dark-blue);
    }
    .btn-blue:hover {
      background-color: var(--dark-blue);
      color: #fff;
    }

    .btn-danger {
      background-color: #ffebee;
      color: #c62828;
    }
    .btn-danger:hover {
      background-color: #e53935;
      color: #fff;
    }

    /* メインモード切り替えバー */
    .mode-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      flex: 1;
      background-color: #ffffff;
      border: 3px solid var(--main-blue);
      color: var(--dark-blue);
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 900;
      font-size: 1rem;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .mode-btn.active {
      background-color: var(--main-pink);
      color: #880e4f;
      border-color: var(--dark-pink);
    }

    /* カテゴリーフィルタタブ */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      background-color: #ffffff;
      border: 2px solid var(--main-blue);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s ease;
      text-align: center;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background-color: var(--dark-pink);
      color: #ffffff;
      border-color: var(--dark-pink);
    }

    /* レイアウト */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 16px;
    }

    @media (max-width: 850px) {
      .grid-2col, .grid-3col { grid-template-columns: 1fr; }
      .user-select-bar { flex-direction: column; align-items: stretch; }
    }

    .card {
      background-color: var(--card-bg);
      border: 3px solid var(--main-blue);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.2rem;
      color: var(--dark-blue);
      margin-bottom: 16px;
      border-bottom: 3px dashed var(--main-pink);
      padding-bottom: 6px;
      font-weight: 900;
    }

    /* 分類（カテゴリー）表示用バッジ */
    .category-badge {
      display: inline-block;
      background-color: var(--main-pink);
      color: #880e4f;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .input-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    select, input[type="text"], input[type="number"] {
      background-color: #f9fbfd;
      border: 2px solid #b0bec5;
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--dark-pink);
      background-color: #fff;
    }

    /* クラフト表示 */
    .ingredient-list { list-style: none; }
    .ingredient-item {
      background-color: #f4fbfd;
      border: 2px solid var(--main-blue);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      border-left: 6px solid var(--dark-pink);
    }

    .ingredient-main {
      display: flex;
      justify-content: space-between;
      font-weight: 900;
      font-size: 1rem;
    }

    .ingredient-status {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #cfd8dc;
    }

    .stock-ok { color: var(--ok-color); }
    .stock-short { color: var(--short-color); }

    /* インベントリ */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .inv-item {
      background-color: #ffffff;
      border: 2px solid var(--main-blue);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* レシピ作成用素材行 */
    .recipe-ing-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    /* データ一覧表示テーブル */
    .data-list {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .data-list th, .data-list td {
      border: 1px solid var(--main-blue);
      padding: 8px;
      font-size: 0.85rem;
      text-align: left;
    }
    .data-list th {
      background-color: #f4fbfd;
      color: var(--dark-blue);
    }

    .hidden { display: none !important; }
    .empty-msg { color: var(--text-sub); font-size: 0.9rem; font-weight: 700; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎀 Custom Craft & Inventory 🎀</h1>
      <p>自由に追加・編集できる素材 ＆ クラフト管理ツール</p>
    </header>

    <!-- 👤 メンバー選択バー -->
    <div class="user-select-bar">
      <label for="current-user-select">👤 選択中のメンバー:</label>
      <div class="user-controls">
        <select id="current-user-select"></select>
        <button class="btn" id="btn-add-user">＋ メンバー追加</button>
        <button class="btn btn-danger" id="btn-delete-user">削除</button>
      </div>
    </div>

    <!-- メインモード切り替えバー -->
    <div class="mode-bar">
      <button class="mode-btn active" id="btn-mode-craft">🔨 クラフト計算</button>
      <button class="mode-btn" id="btn-mode-inventory">📦 手持ち在庫</button>
      <button class="mode-btn" id="btn-mode-settings">⚙️ 設定（分類・素材・レシピ）</button>
    </div>

    <!-- ==================== モード1: クラフト画面 ==================== -->
    <div id="section-craft">
      <!-- カテゴリー絞り込みタブ -->
      <nav class="tab-bar" id="category-tab-bar"></nav>

      <main class="grid-2col">
        <section class="card">
          <h2>アイテム選択</h2>
         
          <!-- ★ アイテム上の分類（カテゴリー）表示エリア ★ -->
          <div>
            <span class="category-badge" id="selected-item-category">分類: 未選択</span>
          </div>

          <div class="input-group">
            <label for="item-select">クラフトするアイテム</label>
            <select id="item-select"></select>
          </div>
          <div class="input-group">
            <label for="item-count">作成個数</label>
            <input type="number" id="item-count" value="1" min="1" max="99">
          </div>
        </section>

        <section class="card">
          <h2>必要素材リスト</h2>
          <ul id="ingredient-list" class="ingredient-list"></ul>
        </section>
      </main>
    </div>

    <!-- ==================== モード2: インベントリ画面 ==================== -->
    <div id="section-inventory" class="hidden">
      <section class="card">
        <h2>📦 所持素材の入力 (<span id="inv-user-name-display" style="color: #d81b60;">-</span>)</h2>
        <div id="inventory-container" class="inventory-grid"></div>
      </section>
    </div>

    <!-- ==================== モード3: 設定画面 ==================== -->
    <div id="section-settings" class="hidden">
      <main class="grid-3col">
       
        <!-- 🏷️ 1. 分類（カテゴリー）設定 -->
        <div>
          <section class="card">
            <h2>🏷️ 分類の追加</h2>
            <div class="input-group">
              <label>分類名</label>
              <input type="text" id="new-cat-name" placeholder="例: 犯罪素材, 武器">
            </div>
            <button class="btn btn-blue" id="btn-add-category" style="width: 100%;">分類を登録</button>
          </section>

          <section class="card">
            <h2>📋 登録済み分類</h2>
            <div style="max-height: 200px; overflow-y: auto;">
              <table class="data-list">
                <thead>
                  <tr><th>分類名</th><th>操作</th></tr>
                </thead>
                <tbody id="category-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>

        <!-- 🧪 2. 素材設定 -->
        <div>
          <section class="card">
            <h2>🧪 素材の追加</h2>
            <div class="input-group">
              <label>素材名</label>
              <input type="text" id="new-mat-name" placeholder="例: 鉄くず">
            </div>
            <div class="input-group">
              <label>入手場所</label>
              <input type="text" id="new-mat-loc" placeholder="例: スクラップ工場">
            </div>
            <button class="btn btn-blue" id="btn-add-material" style="width: 100%;">素材を登録</button>
          </section>

          <section class="card">
            <h2>📋 登録済み素材</h2>
            <div style="max-height: 200px; overflow-y: auto;">
              <table class="data-list">
                <thead>
                  <tr><th>素材名</th><th>操作</th></tr>
                </thead>
                <tbody id="material-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>

        <!-- 🔨 3. レシピ設定 -->
        <div>
          <section class="card">
            <h2>🔨 レシピの追加</h2>
            <div class="input-group">
              <label>完成アイテム名</label>
              <input type="text" id="new-recipe-name" placeholder="例: ロックピック">
            </div>
            <div class="input-group">
              <label>分類（カテゴリー）</label>
              <select id="new-recipe-category"></select>
            </div>
           
            <label style="font-size: 0.9rem; font-weight: 700;">必要素材</label>
            <div id="recipe-ing-inputs" style="margin-top: 6px; margin-bottom: 12px;"></div>
            <button class="btn" id="btn-add-ing-row" style="font-size: 0.8rem; margin-bottom: 14px;">＋ 必要素材の行を追加</button>

            <button class="btn btn-blue" id="btn-add-recipe" style="width: 100%;">レシピを登録</button>
          </section>

          <section class="card">
            <h2>📜 登録済みレシピ</h2>
            <div style="max-height: 200px; overflow-y: auto;">
              <table class="data-list">
                <thead>
                  <tr><th>アイテム</th><th>分類</th><th>操作</th></tr>
                </thead>
                <tbody id="recipe-table-body"></tbody>
              </table>
            </div>
          </section>
        </div>

      </main>
    </div>

  </div>

  <script>
    /* ----------------------------------
       データ管理 (LocalStorage)
    ---------------------------------- */
    let categories = JSON.parse(localStorage.getItem("custom_craft_categories")) || ["未分類"];
    let materials = JSON.parse(localStorage.getItem("custom_craft_materials")) || {};
    let recipes = JSON.parse(localStorage.getItem("custom_craft_recipes")) || [];
    let membersData = JSON.parse(localStorage.getItem("custom_craft_members")) || { "自分": {} };
    let currentUserName = localStorage.getItem("custom_craft_current_user") || "自分";

    if (!membersData[currentUserName]) {
      currentUserName = Object.keys(membersData)[0] || "自分";
    }

    function saveData() {
      localStorage.setItem("custom_craft_categories", JSON.stringify(categories));
      localStorage.setItem("custom_craft_materials", JSON.stringify(materials));
      localStorage.setItem("custom_craft_recipes", JSON.stringify(recipes));
      localStorage.setItem("custom_craft_members", JSON.stringify(membersData));
      localStorage.setItem("custom_craft_current_user", currentUserName);
    }

    /* ----------------------------------
       DOM要素取得
    ---------------------------------- */
    let currentCategoryFilter = "ALL";

    const userSelect = document.getElementById("current-user-select");
    const btnAddUser = document.getElementById("btn-add-user");
    const btnDeleteUser = document.getElementById("btn-delete-user");

    const btnModeCraft = document.getElementById("btn-mode-craft");
    const btnModeInventory = document.getElementById("btn-mode-inventory");
    const btnModeSettings = document.getElementById("btn-mode-settings");

    const sectionCraft = document.getElementById("section-craft");
    const sectionInventory = document.getElementById("section-inventory");
    const sectionSettings = document.getElementById("section-settings");

    const categoryTabBar = document.getElementById("category-tab-bar");
    const selectedItemCategory = document.getElementById("selected-item-category");
    const itemSelect = document.getElementById("item-select");
    const itemCount = document.getElementById("item-count");
    const ingredientList = document.getElementById("ingredient-list");
    const inventoryContainer = document.getElementById("inventory-container");
    const invUserNameDisplay = document.getElementById("inv-user-name-display");

    // 設定要素 (分類)
    const newCatName = document.getElementById("new-cat-name");
    const btnAddCategory = document.getElementById("btn-add-category");
    const categoryTableBody = document.getElementById("category-table-body");

    // 設定要素 (素材)
    const newMatName = document.getElementById("new-mat-name");
    const newMatLoc = document.getElementById("new-mat-loc");
    const btnAddMaterial = document.getElementById("btn-add-material");
    const materialTableBody = document.getElementById("material-table-body");

    // 設定要素 (レシピ)
    const newRecipeName = document.getElementById("new-recipe-name");
    const newRecipeCategory = document.getElementById("new-recipe-category");
    const recipeIngInputs = document.getElementById("recipe-ing-inputs");
    const btnAddIngRow = document.getElementById("btn-add-ing-row");
    const btnAddRecipe = document.getElementById("btn-add-recipe");
    const recipeTableBody = document.getElementById("recipe-table-body");

    /* ----------------------------------
       初期化
    ---------------------------------- */
    function init() {
      // モード切り替えイベント
      btnModeCraft.addEventListener("click", () => switchMode("craft"));
      btnModeInventory.addEventListener("click", () => switchMode("inventory"));
      btnModeSettings.addEventListener("click", () => switchMode("settings"));

      // メンバー管理
      btnAddUser.addEventListener("click", addUser);
      btnDeleteUser.addEventListener("click", deleteUser);
      userSelect.addEventListener("change", (e) => {
        currentUserName = e.target.value;
        saveData();
        refreshAllUI();
      });

      // クラフト計算
      itemSelect.addEventListener("change", updateCraftView);
      itemCount.addEventListener("input", updateCraftView);

      // 設定イベント
      btnAddCategory.addEventListener("click", addCategory);
      btnAddMaterial.addEventListener("click", addMaterial);
      btnAddIngRow.addEventListener("click", () => createRecipeIngRow());
      btnAddRecipe.addEventListener("click", addRecipe);

      renderUserSelect();
      createRecipeIngRow();
      refreshAllUI();
    }

    function switchMode(mode) {
      [btnModeCraft, btnModeInventory, btnModeSettings].forEach(b => b.classList.remove("active"));
      [sectionCraft, sectionInventory, sectionSettings].forEach(s => s.classList.add("hidden"));

      if (mode === "craft") {
        btnModeCraft.classList.add("active");
        sectionCraft.classList.remove("hidden");
        updateCraftView();
      } else if (mode === "inventory") {
        btnModeInventory.classList.add("active");
        sectionInventory.classList.remove("hidden");
        renderInventoryUI();
      } else if (mode === "settings") {
        btnModeSettings.classList.add("active");
        sectionSettings.classList.remove("hidden");
        renderSettingsUI();
      }
    }

    function refreshAllUI() {
      invUserNameDisplay.textContent = currentUserName;
      renderCategoryTabs();
      renderItemSelectOptions();
      updateCraftView();
      renderInventoryUI();
      renderSettingsUI();
    }

    /* ----------------------------------
       メンバー管理
    ---------------------------------- */
    function renderUserSelect() {
      userSelect.innerHTML = "";
      Object.keys(membersData).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        if (name === currentUserName) opt.selected = true;
        userSelect.appendChild(opt);
      });
    }

    function addUser() {
      const name = prompt("追加するメンバーの名前を入力してください:");
      if (name && name.trim()) {
        const cleanName = name.trim();
        if (!membersData[cleanName]) {
          membersData[cleanName] = {};
          currentUserName = cleanName;
          saveData();
          renderUserSelect();
          refreshAllUI();
        } else {
          alert("その名前はすでに存在します。");
        }
      }
    }

    function deleteUser() {
      const keys = Object.keys(membersData);
      if (keys.length <= 1) return alert("最後の1人は削除できません。");
      if (confirm(`「${currentUserName}」さんを削除しますか？`)) {
        delete membersData[currentUserName];
        currentUserName = Object.keys(membersData)[0];
        saveData();
        renderUserSelect();
        refreshAllUI();
      }
    }

    /* ----------------------------------
       クラフト計算 ＆ カテゴリー絞り込み
    ---------------------------------- */
    function renderCategoryTabs() {
      categoryTabBar.innerHTML = "";
     
      const allBtn = document.createElement("button");
      allBtn.className = `tab-btn ${currentCategoryFilter === 'ALL' ? 'active' : ''}`;
      allBtn.textContent = "ALL";
      allBtn.addEventListener("click", () => {
        currentCategoryFilter = "ALL";
        renderCategoryTabs();
        renderItemSelectOptions();
      });
      categoryTabBar.appendChild(allBtn);

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${currentCategoryFilter === cat ? 'active' : ''}`;
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          currentCategoryFilter = cat;
          renderCategoryTabs();
          renderItemSelectOptions();
        });
        categoryTabBar.appendChild(btn);
      });
    }

    function renderItemSelectOptions() {
      itemSelect.innerHTML = "";

      const filteredRecipes = recipes.map((r, originalIdx) => ({ ...r, originalIdx }))
        .filter(r => currentCategoryFilter === "ALL" || r.category === currentCategoryFilter);

      if (filteredRecipes.length === 0) {
        itemSelect.innerHTML = `<option value="">-- レシピがありません --</option>`;
        selectedItemCategory.textContent = "分類: なし";
        return;
      }

      filteredRecipes.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.originalIdx;
        opt.textContent = r.name;
        itemSelect.appendChild(opt);
      });

      updateCraftView();
    }

    function updateCraftView() {
      ingredientList.innerHTML = "";
      const idx = itemSelect.value;

      if (idx === "" || !recipes[idx]) {
        ingredientList.innerHTML = `<li class="empty-msg">「設定」タブからレシピを登録してください。</li>`;
        selectedItemCategory.textContent = "分類: なし";
        return;
      }

      const recipe = recipes[idx];
      selectedItemCategory.textContent = `分類: ${recipe.category || '未分類'}`;

      const count = parseInt(itemCount.value) || 1;
      const userStock = membersData[currentUserName] || {};

      recipe.ingredients.forEach(ing => {
        const totalReq = ing.amount * count;
        const currentStock = userStock[ing.name] || 0;
        const diff = currentStock - totalReq;
        const isEnough = diff >= 0;
        const loc = materials[ing.name] || "未登録";

        const li = document.createElement("li");
        li.className = "ingredient-item";
        li.innerHTML = `
          <div class="ingredient-main">
            <span>${ing.name}</span>
            <span style="color: var(--dark-blue);">必要: x${totalReq}</span>
          </div>
          <div class="ingredient-status">
            <span>${currentUserName}の所持: ${currentStock}個</span>
            <span class="${isEnough ? 'stock-ok' : 'stock-short'}">
              ${isEnough ? '✅ 作成可能' : `❌ 不足: ${Math.abs(diff)}個`}
            </span>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-sub); margin-top: 4px;">📍 入手場所: ${loc}</div>
        `;
        ingredientList.appendChild(li);
      });
    }

    /* ----------------------------------
       インベントリ管理
    ---------------------------------- */
    function renderInventoryUI() {
      inventoryContainer.innerHTML = "";
      const matNames = Object.keys(materials);

      if (matNames.length === 0) {
        inventoryContainer.innerHTML = `<div class="empty-msg" style="grid-column: 1/-1;">「設定」タブから素材を登録してください。</div>`;
        return;
      }

      const userStock = membersData[currentUserName] || {};

      matNames.forEach(matName => {
        const stock = userStock[matName] || 0;
        const loc = materials[matName];

        const card = document.createElement("div");
        card.className = "inv-item";
        card.innerHTML = `
          <div style="font-weight: 900; color: var(--dark-blue);">${matName}</div>
          <div style="font-size: 0.8rem; color: var(--text-sub);">📍 ${loc}</div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
            <label style="font-size: 0.85rem; font-weight: 700;">所持数:</label>
            <input type="number" min="0" value="${stock}" style="width: 100%; text-align: right;">
          </div>
        `;

        card.querySelector("input").addEventListener("input", (e) => {
          const val = parseInt(e.target.value) || 0;
          if (!membersData[currentUserName]) membersData[currentUserName] = {};
          membersData[currentUserName][matName] = val;
          saveData();
        });

        inventoryContainer.appendChild(card);
      });
    }

    /* ----------------------------------
       設定機能 (分類・素材・レシピ)
    ---------------------------------- */
    // 分類追加・削除
    function addCategory() {
      const name = newCatName.value.trim();
      if (!name) return alert("分類名を入力してください。");
      if (categories.includes(name)) return alert("すでに存在する分類です。");

      categories.push(name);
      saveData();
      newCatName.value = "";
      refreshAllUI();
    }

    function deleteCategory(catName) {
      if (confirm(`分類「${catName}」を削除しますか？`)) {
        categories = categories.filter(c => c !== catName);
        saveData();
        refreshAllUI();
      }
    }

    // 素材追加・削除
    function addMaterial() {
      const name = newMatName.value.trim();
      const loc = newMatLoc.value.trim() || "情報なし";
      if (!name) return alert("素材名を入力してください。");

      materials[name] = loc;
      saveData();
      newMatName.value = "";
      newMatLoc.value = "";
      refreshAllUI();
    }

    function deleteMaterial(name) {
      if (confirm(`素材「${name}」を削除しますか？`)) {
        delete materials[name];
        saveData();
        refreshAllUI();
      }
    }

    // レシピ素材行
    function createRecipeIngRow() {
      const div = document.createElement("div");
      div.className = "recipe-ing-row";
      let optionsHtml = Object.keys(materials).map(m => `<option value="${m}">${m}</option>`).join("");
      if (!optionsHtml) optionsHtml = `<option value="">(素材未登録)</option>`;

      div.innerHTML = `
        <select class="ing-select" style="flex: 2;">${optionsHtml}</select>
        <input type="number" class="ing-amount" placeholder="個数" value="1" min="1" style="flex: 1;">
        <button class="btn btn-danger" style="padding: 6px 10px;">✕</button>
      `;

      div.querySelector(".btn-danger").addEventListener("click", () => div.remove());
      recipeIngInputs.appendChild(div);
    }

    // レシピ追加・削除
    function addRecipe() {
      const name = newRecipeName.value.trim();
      const category = newRecipeCategory.value;
      if (!name) return alert("完成アイテム名を入力してください。");

      const ingRows = recipeIngInputs.querySelectorAll(".recipe-ing-row");
      const ingredients = [];

      ingRows.forEach(row => {
        const matName = row.querySelector(".ing-select").value;
        const amount = parseInt(row.querySelector(".ing-amount").value) || 1;
        if (matName) ingredients.push({ name: matName, amount });
      });

      if (ingredients.length === 0) return alert("素材を1つ以上追加してください。");

      recipes.push({ name, category, ingredients });
      saveData();

      newRecipeName.value = "";
      recipeIngInputs.innerHTML = "";
      createRecipeIngRow();
      refreshAllUI();
    }

    function deleteRecipe(idx) {
      if (confirm(`レシピ「${recipes[idx].name}」を削除しますか？`)) {
        recipes.splice(idx, 1);
        saveData();
        refreshAllUI();
      }
    }

    // 設定画面UI更新
    function renderSettingsUI() {
      // 分類テーブル
      categoryTableBody.innerHTML = "";
      categories.forEach(cat => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${cat}</strong></td>
          <td><button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;">削除</button></td>
        `;
        tr.querySelector(".btn-danger").addEventListener("click", () => deleteCategory(cat));
        categoryTableBody.appendChild(tr);
      });

      // 素材テーブル
      materialTableBody.innerHTML = "";
      Object.keys(materials).forEach(name => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${name}</strong></td>
          <td><button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;">削除</button></td>
        `;
        tr.querySelector(".btn-danger").addEventListener("click", () => deleteMaterial(name));
        materialTableBody.appendChild(tr);
      });

      // レシピテーブル
      recipeTableBody.innerHTML = "";
      recipes.forEach((r, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${r.name}</strong></td>
          <td><span style="font-size:0.75rem; background: var(--main-pink); padding: 2px 6px; border-radius: 6px;">${r.category || '未分類'}</span></td>
          <td><button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;">削除</button></td>
        `;
        tr.querySelector(".btn-danger").addEventListener("click", () => deleteRecipe(idx));
        recipeTableBody.appendChild(tr);
      });

      // レシピ登録フォーム内の分類プルダウン更新
      newRecipeCategory.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join("");

      // レシピ登録フォーム内の素材プルダウン更新
      const selects = recipeIngInputs.querySelectorAll(".ing-select");
      let optionsHtml = Object.keys(materials).map(m => `<option value="${m}">${m}</option>`).join("");
      if (!optionsHtml) optionsHtml = `<option value="">(素材未登録)</option>`;

      selects.forEach(sel => {
        const curVal = sel.value;
        sel.innerHTML = optionsHtml;
        sel.value = curVal;
      });
    }

    init();
  </script>
</body>
</html>
